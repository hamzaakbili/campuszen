# Application
spring.application.name=CampusZen API
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campuszen}
spring.datasource.username=${DB_USER:campuszen_user}
spring.datasource.password=${DB_PASSWORD:159357}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${APP_JWT_SECRET:campuszen-super-secret-key-change-me-2026}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
