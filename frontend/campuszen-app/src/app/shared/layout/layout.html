<div class="layout-container">
    <!-- Header avec Navigation -->
    <header class="header">
      <a class="logo-link" routerLink="/dashboard" aria-label="Retour au dashboard">
        <h1>🏠 CampusZen</h1>
      </a>
      <nav class="nav">
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          📊 Dashboard
        </a>
        <a routerLink="/tasks" routerLinkActive="active">
          ✅ Tâches
        </a>
        <a routerLink="/expenses" routerLinkActive="active">
          💰 Dépenses
        </a>
        <a routerLink="/shopping" routerLinkActive="active">
          🛒 Courses
        </a>
        <a routerLink="/events" routerLinkActive="active">
          📅 Événements
        </a>
      </nav>
      <div class="user-menu">
        <button class="profile-chip" routerLink="/profile" type="button">
          <span class="avatar" [style.background]="avatarColor">{{ userInitial }}</span>
          <span class="name">{{ userName }}</span>
        </button>
        <app-notifications></app-notifications>
        <button class="btn-profile" routerLink="/profile">Profil</button>
        <button class="btn-logout" (click)="logout()">Déconnexion</button>
      </div>
    </header>
  
    <!-- Contenu de la page -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
