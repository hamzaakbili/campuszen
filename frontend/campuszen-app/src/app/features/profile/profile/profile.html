<div class="profile-container">
  <div class="profile-card" *ngIf="!isLoading; else loadingState">
    <div class="card-header">
      <div class="title-group">
        <h1>Mon profil</h1>
        <p>Personnalisez votre compte CampusZen</p>
      </div>
      <button class="btn-back" routerLink="/dashboard">Retour dashboard</button>
    </div>

    <form (ngSubmit)="onSave()">
      <div class="avatar-preview">
        <div class="avatar-circle" [style.background]="profile.avatarColor">
          {{ profile.firstName.charAt(0) || 'U' }}
        </div>
        <div>
          <h3>{{ profile.firstName }} {{ profile.lastName }}</h3>
          <p>{{ email }}</p>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" [(ngModel)]="profile.firstName" name="firstName" required />
        </div>

        <div class="form-group">
          <label>Nom</label>
          <input type="text" [(ngModel)]="profile.lastName" name="lastName" required />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" [value]="email" readonly />
        </div>

        <div class="form-group">
          <label>Cursus</label>
          <input type="text" [(ngModel)]="profile.cursus" name="cursus" placeholder="Ex: Informatique L3" />
        </div>

        <div class="form-group color-group">
          <label>Couleur avatar</label>
          <div class="color-input-wrap">
            <input type="color" [(ngModel)]="profile.avatarColor" name="avatarColor" />
            <span>{{ profile.avatarColor }}</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Bio</label>
        <textarea
          [(ngModel)]="profile.bio"
          name="bio"
          rows="4"
          placeholder="Quelques mots sur vous (organisation, préférences, disponibilité...)"
        ></textarea>
      </div>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>

      <div class="actions">
        <button type="submit" class="btn-save" [disabled]="isSaving">
          {{ isSaving ? 'Enregistrement...' : 'Enregistrer le profil' }}
        </button>
      </div>
    </form>
  </div>

  <ng-template #loadingState>
    <div class="loading">Chargement du profil...</div>
  </ng-template>
</div>
