<div class="register-container">
    <div class="register-card">
      <h1>CampusZen</h1>
      <h2>Créer un compte</h2>
  
      <form (ngSubmit)="onSubmit()">
        <div class="form-row">
          <div class="form-group">
            <label>Prénom</label>
            <input 
              type="text" 
              [(ngModel)]="firstName" 
              name="firstName"
              placeholder="John"
              required
            >
          </div>
  
          <div class="form-group">
            <label>Nom</label>
            <input 
              type="text" 
              [(ngModel)]="lastName" 
              name="lastName"
              placeholder="Doe"
              required
            >
          </div>
        </div>
  
        <div class="form-group">
          <label>Email</label>
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email"
            placeholder="ton.email@exemple.com"
            required
          >
        </div>
  
        <div class="form-group">
          <label>Cursus</label>
          <input 
            type="text" 
            [(ngModel)]="cursus" 
            name="cursus"
            placeholder="Informatique, Médecine, etc."
            required
          >
        </div>
  
        <div class="form-group">
          <label>Mot de passe</label>
          <input 
            type="password" 
            [(ngModel)]="password" 
            name="password"
            placeholder="••••••••"
            required
          >
        </div>
  
        <div class="form-group">
          <label>Confirmer le mot de passe</label>
          <input 
            type="password" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword"
            placeholder="••••••••"
            required
          >
        </div>
  
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>
  
        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Inscription...' : 'S\'inscrire' }}
        </button>
      </form>
  
      <p class="login-link">
        Déjà un compte ? 
        <a routerLink="/login">Se connecter</a>
      </p>
    </div>
  </div>
